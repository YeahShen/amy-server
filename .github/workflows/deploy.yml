name: 构建发布 amy-server Docker 镜像

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

concurrency:
  # 同一分支/PR 的重复运行只保留最新，避免连推时排队构建旧代码
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 JDK 21 构建（与 Dockerfile 基础镜像 21-jre-alpine、pom java.version 一致）
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 发布版本取当前推送的 tag 名（push tags 事件下 github.event.release 为 null，
      # 只能用 github.ref_name，如 refs/tags/v1.0 → v1.0）；
      # jar 版本去掉 v 前缀（0.1.0），镜像 tag 保持 v1.0 形态（见下方 tags 配置）
      - name: Set version from Git tag
        run: mvn versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms

      # mvnw 以 100644 入库，Linux runner 上需补执行位；
      # 测试保持跳过（与 pom 默认一致，CI 无 DB/Redis 时 @SpringBootTest 无法启动）
      - name: Maven 打包
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      # master 推送 / 手动触发必须有 ACR 凭据；缺失时给明确报错而非等登录步骤失败
      # 注：secrets 不能在 if: 表达式中直接引用（解析期报 Unrecognized named-value），
      #     故先映射到步骤 env，再在 run 脚本内做空值校验
      - name: 校验 ACR 凭据
        if: github.event_name != 'pull_request'
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "此事件需要 ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD secrets"
            echo "请在仓库 Settings → Secrets and variables → Actions 中配置阿里云 ACR 用户名与密码"
            exit 1
          fi

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # 登录只在需要时发生：master 推送 / 手动触发必登录（上面校验步骤已保证凭据存在）；
      # 同仓库分支的 PR 也登录（基础镜像为私有时拉取需要）；fork 的 PR 拿不到 secrets，自动跳过
      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # Dockerfile 依赖 boot/target/*.jar（多模块工程中唯一可执行 jar，即上方 Maven 产物），
      # 注意不能把 boot/target 加进 .dockerignore
      # PR 只构建不推送；master 推送 / 手动触发推 latest + 完整 commit sha 两个 tag，便于回滚指定版本
      # type=gha 复用上次构建的镜像层，二次构建免重复下载/执行耗时步骤
      # provenance/sbom: build-push-action v6 默认生成来源证明与 SBOM 制品（OCI artifact），
      #   阿里云 ACR 不支持此类制品，推送会报 denied: unknown manifest class，故显式关闭
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/ashen_station/amy-server:latest
            registry.cn-hangzhou.aliyuncs.com/ashen_station/amy-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 触发服务器 Webhook 部署
        uses: fjogeleit/http-request-action@v1
        with:
          url: https://hooks.ashen-station.top/hooks/deploy-my-app
          method: 'GET'
          customHeaders: '{"X-Webhook-Secret": "${{ secrets.WEBHOOK_SECRET }}"}'

      # -------------------- 2. 部署成功时发送邮件 --------------------
      - name: 发送部署成功邮件通知
        if: success() # 仅当前面步骤全部成功时执行
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP 服务器配置（以 QQ 邮箱为例，常用服务器列表见下方）
          server_address: smtp.163.com
          server_port: 465
          secure: true
          # 认证信息（强烈建议存放在 GitHub Secrets 中）
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }} # 注意：QQ/163 邮箱此处填授权码，非登录密码
          
          # 邮件内容配置
          subject: "🎉 【部署成功】服务已更新 - ${{ github.repository }}"
          to: 707978562@qq.com # 接收通知的邮箱，多邮箱用逗号隔开
          from: "GitHub CI/CD Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h3>🚀 项目部署成功</h3>
            <p><strong>项目仓库:</strong> ${{ github.repository }}</p>
            <p><strong>触发分支:</strong> ${{ github.ref_name }}</p>
            <p><strong>提交信息:</strong> ${{ github.event.head_commit.message }}</p>
            <p><strong>提交 Hash:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><strong>触发人员:</strong> ${{ github.actor }}</p>
            <hr>
            <p><i>本邮件由 GitHub Actions 自动化流水线自动发送，请勿直接回复。</i></p>

      # -------------------- 3. 部署失败时发送告警邮件 --------------------
      - name: 发送部署失败告警邮件
        if: failure() # 仅当前面有步骤失败时执行
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ 【部署失败】服务更新异常 - ${{ github.repository }}"
          to: 707978562@qq.com
          from: "GitHub CI/CD Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h3>⚠️ 项目部署失败，请及时排查！</h3>
            <p><strong>项目仓库:</strong> ${{ github.repository }}</p>
            <p><strong>触发分支:</strong> ${{ github.ref_name }}</p>
            <p><strong>提交 Hash:</strong> ${{ github.sha }}</p>
            <p><strong>排查链接:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看详细构建日志</a></p>