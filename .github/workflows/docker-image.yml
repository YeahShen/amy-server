name: 构建发布 amy-server Docker 镜像

on:
  push:
    branches: [ master ]        # master 推送: 打包 → 构建 → 推送 ACR
  pull_request:
    branches: [ master ]        # PR: 仅构建验证，不推送
  workflow_dispatch:            # 支持手动触发补发镜像

concurrency:
  # 同一分支/PR 的重复运行只保留最新，避免连推时排队构建旧代码
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE: ashen_station/amy-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 JDK 21 构建（与 Dockerfile 基础镜像 21-jre-alpine 一致）；pom java.version=17 决定字节码目标仍为 17
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw 以 100644 入库，Linux runner 上需补执行位；
      # 测试保持跳过（与 pom 默认一致，CI 无 DB/Redis 时 @SpringBootTest 无法启动）
      - name: Maven 打包
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      # master 推送必须有 ACR 凭据；缺失时给明确报错而非等登录步骤失败
      - name: 校验 ACR 凭据（仅 master 推送）
        if: github.event_name == 'push' && (secrets.ALIYUN_ACR_USERNAME == '' || secrets.ALIYUN_ACR_PASSWORD == '')
        run: |
          echo "master 推送需要 ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD secrets"
          echo "请在仓库 Settings → Secrets and variables → Actions 中配置阿里云 ACR 用户名与密码"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # 配置了凭据才登录：master 推送发布镜像需要；若基础镜像为私有，PR 构建同样需要
      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        if: secrets.ALIYUN_ACR_USERNAME != ''
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # Dockerfile 依赖 target/*.jar（即上方 Maven 产物），注意不能把 target 加进 .dockerignore
      # PR 只构建不推送；master 推 latest + 完整 commit sha 两个 tag，便于回滚指定版本
      # type=gha 复用上次构建的镜像层，二次构建免重复下载/执行耗时步骤
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
