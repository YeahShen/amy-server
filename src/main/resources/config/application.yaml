spring:
  application:
    name: amy-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  freemarker:
    charset: UTF-8
    suffix: .ftlh
    template-loader-path: classpath:/templates/
    cache: false   # 开发阶段关闭缓存
    check-template-location: false  # 非视图场景可关闭模板位置检查，避免无谓警告

server:
  port: 9999


jwt:
  client-header: X_PLATFORM
  header: Authorization
  token-start-with: Bearer
  online-key: "app_online_token:"
  resource-permission-key: "resources_permission:"

rsa:
  private_key: 

login:
  single-login: true