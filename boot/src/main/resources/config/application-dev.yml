ffmpeg:
  ffmpeg-executor-path: D:\workspace\resource\ffmpeg-n8.0-latest-win64-gpl-8.0\bin\ffmpeg.exe
  ffprobe-executor-path: D:\workspace\resource\ffmpeg-n8.0-latest-win64-gpl-8.0\bin\ffprobe.exe
  video-encoder: h264_amf
  audio-encoder: aac
  # 硬件设备参数（留空 = 纯软编）；d3d11va 设备名固定为 hw，须与模板里的 -filter_hw_device / hwupload 一致
  hw-args: -init_hw_device d3d11va=hw -filter_hw_device hw
  # 编码器专属参数：h264_amf 用 -quality speed，libx264 用 -preset veryfast，h264_qsv 用 -preset veryfast
  video-encoder-args: -quality speed
  audio-encoder-args: ""
  do-not-re-encoding-format:
    - 'h264'
    - 'h265'
    - 'av1'
    - 'vp9'