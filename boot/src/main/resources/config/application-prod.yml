spring:
  datasource:
    url: jdbc:mariadb://${DATASOURCE_HOST}:${DATASOURCE_PORT}/${DATASOURCE_NAME}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DB}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  rabbitmq:
    host: ${MQ_HOST}      # 服务器地址，默认 localhost
    port: ${MQ_PORT}           # 端口，默认 5672
    username: ${MQ_USERNAME}      # 用户名，默认 guest
    password: ${MQ_PASSWORD}      # 密码，默认 guest
    virtual-host: /      # 虚拟主机，默认为 /
    publisher-confirm-type: correlated  # 开启发送方确认
    publisher-returns: true            # 开启发送方回退
    listener:
      simple:
        acknowledge-mode: manual       # 手动确认，收到消息后需显式 ack
        concurrency: 3                 # 并发消费者数量
        max-concurrency: 10            # 最大并发数


jwt:
  # 必须使用最少88位的Base64对该令牌进行编码
  base64-secret: ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZmI3MjdhN2ZmMjNhODViOTg1ZGE0NTBjMGM4NDA5NzYxMjdjOWMwYWRmZTBlZjlhNGY3ZTg4Y2U3YTE1ODVkZDU5Y2Y3OGYwZWE1NzUzNWQ2YjFjZDc0NGMxZWU2MmQ3MjY1NzJmNTE0MzI=
  # 令牌过期时间 此处单位/毫秒 ，默认4小时，可在此网站生成 https://www.convertworld.com/zh-hans/time/milliseconds.html
  token-validity-in-seconds: 7200000
  # token 续期检查时间范围（默认30分钟，单位默认毫秒），在token即将过期的一段时间内用户操作了，则给用户的token续期
  detect: 1800000
  # 续期时间范围，默认 1小时，这里单位毫秒
  renew: 3600000

login:
  single-login: true

static-resource-directory-properties:
  user-avatar-directory: /amy/user-avatar
  user-avatar-path-prefix: /resource/user-avatar
  artist-avatar-directory: /amy/artist-avatar
  artist-avatar-path-prefix: /resource/artist-avatar
  video-roots:
    - { name: 'no.1', path: /amy/video_1 }
  enable-video-root: 'no.1'
  video-resource-prefix: /resource/video
  upload-temp-directory: /amy/temp
  poster-path-prefix: /resource/poster
  poster-directory: /amy/poster
  video-temp-directory: /amy/video_temp

ffmpeg:
  ffprobe-executor-path: ffprobe
  ffmpeg-executor-path: ffmpeg
  #  "libx264", "h264_nvenc", "h264_amf", "h264_qsv"
  video-encoder: h264_qsv
  audio-encoder: aac
  # 硬件设备参数（留空 = 纯软编）；切 Intel QSV 硬编时改为 -init_hw_device qsv=hw -filter_hw_device hw
  hw-args: "-init_hw_device qsv=hw -filter_hw_device hw"
  # 编码器专属参数：h264_qsv 用 -preset veryfast，libx264 用 -preset veryfast
  video-encoder-args: -preset veryfast
  audio-encoder-args: ""
  do-not-re-encoding-format:
    - 'h264'
    - 'h265'
    - 'av1'
    - 'vp9'